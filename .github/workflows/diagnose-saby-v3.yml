name: Diagnose Saby API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only targeted diagnostics v3
        env:
          SABY_APP_ID: ${{ secrets.SABY_APP_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
        run: |
          node <<'JS'
          const env = process.env;
          const base = 'https://api.sbis.ru/retail/';
          const query = 'BRUSKO Noir 25000';
          const normalize = x => String(x ?? '').toLowerCase().trim().replace(/ё/g, 'е').replace(/^(sv|si)\s+/, '');
          let token, calls = 0, failed = false;
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function get(path, params) {
            if (calls >= 40) throw Error('request budget reached');
            calls++;
            const u = new URL(path, base);
            for (const [k,v] of Object.entries(params)) if (v != null) u.searchParams.set(k, String(v));
            await sleep(250);
            let r;
            try { r = await fetch(u, {headers:{'X-SBISAccessToken':token}, redirect:'error', signal:AbortSignal.timeout(15000)}); }
            catch { throw Error('network or timeout'); }
            if (!r.ok) throw Error('HTTP ' + r.status);
            try { return await r.json(); } catch { throw Error('invalid JSON'); }
          }
          function array(d, key) {
            const v = d?.[key];
            if (Array.isArray(v)) return v;
            if (v && typeof v === 'object') {
              if ('id' in v || 'name' in v) return [v];
              const a = Object.values(v);
              if (a.every(x=>x && typeof x==='object' && !Array.isArray(x))) return a;
            }
            throw Error('unexpected response shape');
          }
          async function read(params, size) {
            let a = [];
            for (let page=0; page<6; page++) {
              const d = await get('v2/nomenclature/list', {...params, pageSize:size, page});
              const part = array(d, 'nomenclatures');
              a.push(...part);
              if (d?.outcome?.hasMore === false) return a;
              if (d?.outcome?.hasMore !== true || !part.length) throw Error('pagination uncertain');
            }
            throw Error('page budget reached');
          }
          async function probe(label, pointId, withBalance) {
            const params = {pointId, withBalance};
            try {
              let a;
              try { a = await read({...params,searchString:query},25); }
              catch(e) {
                console.log(label+' search: '+e.message);
                if (e.message!=='HTTP 500') throw e;
                a = await read({...params,searchString:query},5);
              }
              const matches = x=>normalize(x.name).includes(normalize(query));
              const result = a.filter(x=>!x.isParent && matches(x));
              const folders = a.filter(x=>x.isParent && normalize(x.name)===normalize(query));
              const hids = [...new Set(folders.map(x=>x.hierarchicalId).filter(x=>x!=null))];
              console.log(`${label}: search rows=${a.length}; matching leaves=${result.length}; matching folders=${folders.length}`);
              let source = result;
              if (hids.length === 1) {
                try {
                  const f = await read({...params,folder:hids[0]},25);
                  if (f.some(x=>x.isParent)) throw Error('nested folders; result not complete');
                  source = f;
                  console.log(label+' folder: HTTP OK; rows='+source.length);
                } catch(e) {
                  console.log(label+' folder: '+e.message+'; search result only');
                  failed = true;
                }
              } else {
                console.log(label+': search results only; folder completeness not established');
              }
              const unique = new Map();
              let missing = 0;
              for(const x of source) { if(x.id==null) missing++; else unique.set(String(x.id),x); }
              const known = [...unique.values()].filter(x=>x.balance!=null && String(x.balance).trim()!=='' && Number.isFinite(Number(x.balance)));
              console.log(`${label}: unique IDs=${unique.size}; missing IDs=${missing}` + (withBalance ? `; positive=${known.filter(x=>Number(x.balance)>0).length}; nonpositive=${known.filter(x=>Number(x.balance)<=0).length}; unknown=${unique.size-known.length}` : ''));
              return new Set(unique.keys());
            } catch(e) { failed=true; console.log(label+' ERROR: '+e.message); return null; }
          }
          async function main(){
            if(!env.SABY_APP_ID||!env.SABY_APP_SECRET||!env.SABY_SECRET_KEY) throw Error('missing secrets');
            const r=await fetch('https://online.sbis.ru/oauth/service/',{method:'POST',headers:{'Content-Type':'application/json'},redirect:'error',signal:AbortSignal.timeout(15000),body:JSON.stringify({app_client_id:env.SABY_APP_ID,app_secret:env.SABY_APP_SECRET,secret_key:env.SABY_SECRET_KEY})});
            console.log('Authorization: HTTP '+r.status);
            if(!r.ok) throw Error('authorization failed');
            const auth=await r.json(); token=auth.token||auth.access_token;
            if(typeof token!=='string'||!token) throw Error('no token');
            console.log('::add-mask::'+token.replace(/[\r\n]/g,''));
            const p=await get('point/list',{product:'retail',pageSize:100,page:0});
            const points=array(p,'salesPoints');
            console.log('Sales points: '+points.length);
            const global=await probe('GLOBAL',null,false);
            for(const name of ['Гаджиева','Баумана']){
              const matches=points.filter(x=>normalize(x.name)===normalize(name));
              if(matches.length!==1||matches[0].id==null){failed=true;console.log(name+': point not uniquely found');continue;}
              const noBalance=await probe(name+' balance=false',matches[0].id,false);
              const balance=await probe(name+' balance=true',matches[0].id,true);
              if(global&&noBalance) console.log(name+' matched global='+[...noBalance].filter(x=>global.has(x)).length);
              if(noBalance&&balance) console.log(name+' absent in balance response='+[...noBalance].filter(x=>!balance.has(x)).length+' (not proof of zero stock)');
            }
            console.log('Diagnostics finished; API GET requests: '+calls);
            console.log('Read-only test; no data published.');
            if(failed) process.exitCode=1;
          }
          main().catch(()=>{console.error('Diagnostics failed; see preceding status');process.exitCode=1;});
          JS
