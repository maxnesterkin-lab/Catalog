name: Saby API diagnostic
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Saby API
        env:
          SABY_APP_ID: ${{ secrets.SABY_APP_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
        run: |
          node - <<'JS'
          const {client} = require('./update-script.js');
          (async () => {
            const api = client(process.env);
            await api.login();
            const tests = [
              ['Folder cursor', {folder:11164,order:'after'}],
              ['Global cursor', {position:11164,order:'after'}],
              ['Name search', {searchString:'OGGO',page:0}]
            ];
            for (const [name,params] of tests) {
              try {
                const d = await api.get('v2/nomenclature/list',
                  {...params,pageSize:25,withBalance:false});
                const rows = Array.isArray(d.nomenclatures)
                  ? d.nomenclatures
                  : Object.values(d.nomenclatures || {});
                const matched = rows.filter(x =>
                  String(x.hierarchicalParent)==='11164');
                console.log(name,'OK','rows='+rows.length,
                  'folderMatches='+matched.length);
              } catch(e) {
                console.log(name,'FAILED',e.status || e.name);
              }
            }
          })().catch(()=>{console.error('Diagnostic failed');process.exitCode=1});
          JS