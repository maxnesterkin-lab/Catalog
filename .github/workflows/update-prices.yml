name: Saby catalog safe preview 68
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: saby-preview-68
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/saby-test-20261120-105612' && !inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare temporary preview script
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          let s=fs.readFileSync('update-script.js','utf8');
          const replace=(from,to)=>{
            if(s.split(from).length!==2)throw Error('Source mismatch: '+from);
            s=s.replace(from,to);
          };
          if(!s.includes('async function cursorPaged('))throw Error('Missing cursor implementation');
          replace('async function folder(api,params){',`async function folder(api,params){
            if(String(params.folder)==='11164'){
              const result=await cursorPaged(api,params,25);
              console.log('OGGO cursor OK: point='+(params.pointId??'global')+' rows='+result.length);
              return result;
            }`);
          replace('if(d?.outcome?.hasMore===false) return all;',"if((typeof d.outcome==='boolean'?d.outcome:d?.outcome?.hasMore)===false) return all;");
          replace('if(d?.outcome?.hasMore!==true||!part.length)',"if((typeof d.outcome==='boolean'?d.outcome:d?.outcome?.hasMore)!==true||!part.length)");
          replace('const results=await folder(api,{pointId:store.id,folder:n.hid,withBalance:true});',`const results=await folder(api,{pointId:store.id,folder:n.hid,withBalance:true}).catch(e=>{e.message+='; store='+store.name+' folder='+n.name+' id='+n.hid;throw e;});`);
          replace('const mapped=new Map(results.filter(x=>!x.isParent).map(x=>[key(x.id),x]));',`const mapped=new Map(results.filter(x=>!x.isParent).map(x=>[key(x.id),x]));
            const absent=n.leaves.filter(l=>!mapped.has(l.id)).length;
            const invalid=n.leaves.filter(l=>mapped.has(l.id)&&numeric(mapped.get(l.id).balance)===null).length;
            if(absent||invalid)log('UNKNOWN stock: store='+store.name+' folder='+n.name+' id='+n.hid+' absent='+absent+' invalid='+invalid+' expected='+n.leaves.length);`);
          fs.writeFileSync('preview-68.js',s);
          JS
          node --check preview-68.js
      - name: Scan complete catalog without publishing
        env:
          SABY_APP_ID: ${{ secrets.SABY_APP_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
        run: node preview-68.js
      - name: Publication disabled
        if: always()
        run: echo 'NOTHING PUBLISHED - read-only workflow, no push step'