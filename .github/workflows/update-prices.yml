name: Validate Saby stock by warehouse

on:
  push:
    branches: [validate-saby-stock-by-warehouse]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-data:
    if: github.ref == 'refs/heads/validate-saby-stock-by-warehouse'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run script to fetch data from Saby
        env:
          SABY_APP_ID: ${{ secrets.SABY_APP_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
        run: |
          set -euo pipefail
          node update-script.js stock-preview.json
          node - <<'JS'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync('stock-preview.json', 'utf8'));
          if (!Array.isArray(d.stores) || d.stores.length !== 11 || !Array.isArray(d.categories) || !d.categories.length) {
            throw new Error('Unexpected catalog structure; publication blocked');
          }
          let count = 0;
          for (const c of d.categories) {
            if (!Array.isArray(c.items)) throw new Error('Invalid items');
            for (const p of c.items) {
              if (!Array.isArray(p.flavors)) throw new Error('Invalid positions');
              for (const f of p.flavors) {
                if (!Array.isArray(f.stores) || f.stores.some(i => !Number.isInteger(i) || i < 0 || i >= d.stores.length)) throw new Error('Invalid store index');
                count++;
              }
            }
          }
          if (!count) throw new Error('Empty catalog');
          console.log(`Stores: ${d.stores.length}; categories: ${d.categories.length}; positions: ${count}`);
          JS

      - name: Check stock status consistency
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const data = require('./stock-preview.json');
          const totals = {available:0,zero:0,negative:0,missing:0};
          for (const category of data.categories) {
            for (const product of category.items) {
              for (const flavor of product.flavors) {
                assert.equal(flavor.stockStatus.length, data.stores.length);
                assert.deepEqual(flavor.stores, flavor.stockStatus.flatMap((status,i) => status === 'available' ? [i] : []));
                for (const status of flavor.stockStatus) {
                  assert(Object.hasOwn(totals,status));
                  totals[status]++;
                }
              }
            }
          }
          console.log('Validated stock status totals:', JSON.stringify(totals));
          console.log('Unread catalog folders:', data.unreadFolders?.length ?? 0);
          JS
