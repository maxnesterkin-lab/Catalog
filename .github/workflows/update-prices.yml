name: Update Saby Retail Data

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Warehouse batch size for read-only benchmark"
        required: true
        default: "100"
        type: choice
        options:
          - "50"
          - "100"
          - "200"

permissions:
  contents: read

concurrency:
  group: saby-catalog-update-main
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.ref == 'refs/heads/test/fast-saby-stock-20261128' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Benchmark warehouse-only stock refresh (no publication)
        env:
          SABY_APP_ID: ${{ secrets.SABY_APP_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size || '100' }}
        run: |
          set -euo pipefail
          node fast-stock-test.js "$RUNNER_TEMP/fast-stock-preview.json" "$BATCH_SIZE"
      - name: Upload read-only preview and benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: fast-stock-benchmark-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fast-stock-preview.json
            ${{ runner.temp }}/fast-stock-preview.json.report.json
          if-no-files-found: error
