name: Audit current Saby retail prices
on:
  push:
    branches: ['audit-saby-retail-prices-20261126']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check published variant IDs against current Saby prices
        env:
          SABY_APP_ID: ${{ secrets.SABY_APP_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
        run: node audit-current-prices.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: current-retail-prices
          path: price-audit.json
          retention-days: 2
