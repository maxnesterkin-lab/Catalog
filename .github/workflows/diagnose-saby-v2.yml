name: Verify omitted warehouse balances at Gadzhieva
on:
  push:
    branches: [verify-omitted-balances-gad-20261127]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare the three checked variants with current warehouse balances
        env:
          SABY_APP_ID: ${{ secrets.SABY_APP_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
        run: |
          cp update-script.js verify-module.cjs
          echo 'module.exports.fill=fillWarehouseBalances;' >> verify-module.cjs
          node <<'JS'
          const {client,fill}=require('./verify-module.cjs');
          (async()=>{
            const api=client(process.env);
            await api.login();
            const leaves=['9187','8906','11041'].map(id=>({id,stock:[null]}));
            await fill(api,{name:'Гаджиева',companyId:249,warehouseId:14408},leaves,0,console.log,false);
            console.log('GAD RESULT',JSON.stringify(leaves));
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          JS
