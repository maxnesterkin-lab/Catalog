name: Diagnose Saby API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test 71 - read-only Saby balances and pacing
        timeout-minutes: 17
        env:
          SABY_APP_ID: ${{ secrets.SABY_APP_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const report = {checks:[], companies:[], warehouses:[], mapping:[], comparisons:[], rate:[], complete:false};
          const save = () => fs.writeFileSync('diagnostic-71.json', JSON.stringify(report,null,2));
          const sleep = ms => new Promise(r=>setTimeout(r,ms));
          const base = 'https://api.sbis.ru/retail/';
          const stores = [['Баумана',14401],['ГУМ',433],['Гаджиева',14406],['КТМ',14179],['Крупской',16974],['Книповича',14412],['Кольский',446],['Ленина',409],['Мир',11101],['ПЗ',452],['Североморск',18093]];
          const folders = [11164,11835,14496];
          let token, count=0;
          const norm = v=>String(v??'').toLowerCase().replace(/ё/g,'е').replace(/^(sv|si|severvape|север вейп)\s+/,'').trim();
          const number = x => x==null || typeof x==='boolean' || String(x).trim()==='' || !Number.isFinite(Number(x)) ? null : Number(x);
          const integer = x => { const n=number(x); return Number.isSafeInteger(n)&&n>0?n:null; };
          const objectKeys = d=>d && typeof d==='object'?Object.keys(d).slice(0,20):[];
          function rows(d, keys, idKeys){
            let v=Array.isArray(d)?d:keys.map(k=>d?.[k]).find(x=>x!=null);
            if(v&&typeof v==='object'&&!Array.isArray(v)) v=idKeys.some(k=>k in v)?[v]:Object.values(v);
            if(!Array.isArray(v)||!v.every(x=>x&&typeof x==='object'&&!Array.isArray(x))) throw Error('Unrecognized response structure: '+objectKeys(d).join(','));
            return v;
          }
          async function login(){
            const e=process.env;
            if(!e.SABY_APP_ID||!e.SABY_APP_SECRET||!e.SABY_SECRET_KEY) throw Error('Missing repository secrets');
            const r=await fetch('https://online.sbis.ru/oauth/service/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app_client_id:e.SABY_APP_ID,app_secret:e.SABY_APP_SECRET,secret_key:e.SABY_SECRET_KEY}),redirect:'error',signal:AbortSignal.timeout(15000)});
            if(!r.ok) throw Error('Authorization HTTP '+r.status);
            const d=await r.json();token=d.token||d.access_token;if(typeof token!=='string'||!token)throw Error('No access token');
            console.log('Authorization successful');
          }
          async function get(path,params,label,encoding='repeat'){
            if(++count>160) throw Error('Request budget exceeded');
            await sleep(2000);
            const u=new URL(path,base);
            for(const [k,v] of Object.entries(params)) {
              if(Array.isArray(v)){if(encoding==='json')u.searchParams.set(k,JSON.stringify(v));else for(const x of v)u.searchParams.append(k,String(x));}
              else if(v!=null)u.searchParams.set(k,String(v));
            }
            const rec={number:count,label,status:null,ms:null};let start=Date.now();
            try{
              const r=await fetch(u,{headers:{'X-SBISAccessToken':token},redirect:'error',signal:AbortSignal.timeout(12000)});rec.status=r.status;
              if(!r.ok)throw Error('HTTP '+r.status);
              return await r.json();
            } catch(e){throw Error(rec.status&&!String(e.message).startsWith('HTTP')?'Invalid response or JSON':rec.status?'HTTP '+rec.status:'Network or timeout');}
            finally{rec.ms=Date.now()-start;report.checks.push(rec);console.log(`${rec.number} ${label}: ${rec.status??'network'} (${rec.ms} ms)`);save();}
          }
          async function attempt(label,fn){try{return await fn();}catch(e){console.log(label+': '+e.message);report.checks.push({label,error:e.message});save();return null;}}
          async function catalog(folder,pointId,withBalance){
            const out=[],seen=new Set();
            for(let page=0;page<5;page++){
              const d=await get('v2/nomenclature/list',{folder,pointId,withBalance,page,pageSize:25},`catalog ${folder} point=${pointId??'global'} page=${page}`);
              const a=rows(d,['nomenclatures'],['id']);
              for(const x of a){if(x.isParent)continue;const id=integer(x.id);if(id==null||seen.has(id))throw Error('Missing or duplicate catalog ID');seen.add(id);out.push(x);}
              if(d?.outcome?.hasMore===false)return out;
              if(d?.outcome?.hasMore!==true||!a.length)throw Error('Pagination uncertain');
            }throw Error('Page budget exceeded');
          }
          function balanceMap(a, key){const m=new Map();for(const x of a){const id=integer(x[key]);if(id==null||m.has(id))throw Error('Missing or duplicate balance ID');m.set(id,number(x.balance));}return m;}
          async function main(){
            await login();
            const points=await attempt('point list',async()=>rows(await get('point/list',{product:'retail',pageSize:100,page:0},'point list'),['salesPoints'],['id']));
            const verified=new Set((points??[]).filter(p=>stores.some(([n,id])=>id===integer(p.id)&&(norm(n)===norm(p.name)||n==='Гаджиева'&&norm(p.name)==='гаджиево'))).map(p=>integer(p.id)));
            report.pointsVerified=stores.map(([name,id])=>({name,id,verified:verified.has(id)}));save();
            const samples=[];
            for(const folder of folders){const data=await attempt('global '+folder,()=>catalog(folder,null,false));if(data?.length)samples.push({folder,ids:data.slice(0,5).map(x=>integer(x.id))});}
            report.samples=samples;save();
            const companies=await attempt('companies',async()=>rows(await get('company/list',{},'companies'),['companies','company','items','data','result'],['id','companyId']));
            for(const c of companies??[]){const id=integer(c.id??c.companyId??c.company);if(id==null)continue;report.companies.push({id,name:String(c.name??c.companyName??'').slice(0,150)});
              const a=await attempt('warehouses '+id,async()=>rows(await get('company/warehouses',{companyId:id},'warehouses '+id),['warehouses','warehouse','items','data','result'],['id','warehouseId']));
              for(const w of a??[]){const wid=integer(w.id??w.warehouseId??w.warehouse);if(wid!=null)report.warehouses.push({id:wid,companyId:id,name:String(w.name??w.warehouseName??'').slice(0,150)});}
            }
            for(const [name,id] of stores){const aliases=name==='Гаджиева'?['гаджиева','гаджиево']:[norm(name)];const matches=report.warehouses.filter(w=>aliases.includes(norm(w.name)));const candidates=report.warehouses.filter(w=>aliases.some(a=>norm(w.name).includes(a)));report.mapping.push({name,pointId:id,verifiedPoint:verified.has(id),exactCandidates:matches,otherCandidates:candidates});}
            save();
            // A unique name match is only a candidate until checked against point balances.
            // Request one warehouse and one company at a time; never aggregate across shops.
            const ids=samples.flatMap(s=>s.ids);
            for(const m of report.mapping){if(!m.verifiedPoint||m.exactCandidates.length!==1||!ids.length)continue;const w=m.exactCandidates[0];
              const raw=await attempt('new balances '+m.name,async()=>{let d;try{d=await get('nomenclature/balances',{nomenclatures:ids,warehouses:[w.id],companies:[w.companyId]},'new balances '+m.name);}catch(e){if(!['HTTP 400','HTTP 422'].includes(e.message))throw e;d=await get('nomenclature/balances',{nomenclatures:ids,warehouses:[w.id],companies:[w.companyId]},'new balances JSON arrays '+m.name,'json');}return balanceMap(rows(d,['balances','nomenclatures','items','data','result'],['nomenclature']),'nomenclature');});
              if(!raw)continue;
              for(const sample of samples){const old=await attempt('old balances '+m.name+' '+sample.folder,async()=>balanceMap(await catalog(sample.folder,m.pointId,true),'id'));
                for(const id of sample.ids){const a=old?.get(id)??null,b=raw.get(id)??null;report.comparisons.push({store:m.name,id,old:a,new:b,oldReturned:old?.has(id)??false,newReturned:raw.has(id),status:a===null||b===null?'unknown':a===b?'equal':'different'});}
              }save();
            }
            // Isolate request-count behaviour in a fresh session, without retries or writes.
            // 60 identical small catalog reads at 2 seconds minimum between calls.
            await login();
            for(let i=1;i<=60;i++){if(count>=155)break;const value=await attempt('rate probe '+i,()=>get('v2/nomenclature/list',{folder:11164,withBalance:false,pageSize:25,page:0},'rate probe '+i));report.rate.push({i,ok:value!==null,http:report.checks.findLast(x=>x.label==='rate probe '+i&&x.number)?.status??null});save();}
            if(report.rate.some(r=>!r.ok)&&count<159){await login();await attempt('post-reauth probe',()=>get('v2/nomenclature/list',{folder:11164,withBalance:false,pageSize:25,page:0},'post-reauth probe'));}
            report.complete=report.rate.length===60; report.unmapped=report.mapping.filter(m=>!m.verifiedPoint||m.exactCandidates.length!==1).map(m=>m.name); save();
          }
          main().catch(e=>{report.fatal=e.message;save();console.error(e.message);process.exitCode=1;});
          JS
      - name: Upload diagnostic report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-71
          path: diagnostic-71.json
          if-no-files-found: warn
