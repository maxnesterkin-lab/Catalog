name: Saby catalog synchronization preview 75
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saby-preview-75
  cancel-in-progress: false
jobs:
  preview:
    if: startsWith(github.ref, 'refs/heads/saby-preview-75-')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate preview only
        timeout-minutes: 170
        env:
          SABY_PREVIEW: '1'
          SABY_APP_ID: ${{ secrets.SABY_APP_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
        run: |
          set -euo pipefail
          node --check update-script.js
          node update-script.js
          git diff --exit-code -- data.json index.html .github/workflows/update-prices.yml
          test -s data.preview.json
          test -s sync-preview-report.json
      - name: Upload preview and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-preview-75
          path: |
            data.preview.json
            sync-preview-report.json
          if-no-files-found: warn
