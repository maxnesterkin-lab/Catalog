name: Recheck Saby prices and balances
on:
  push:
    branches: [recheck-saby-catalog-20261126]
permissions:
  contents: read
jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read current prices and warehouse balances
        env:
          SABY_APP_ID: ${{ secrets.SABY_APP_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
        run: node update-script.js "$RUNNER_TEMP/saby-preview.json"
      - uses: actions/upload-artifact@v4
        with:
          name: saby-price-stock-review
          path: ${{ runner.temp }}/saby-preview.json
