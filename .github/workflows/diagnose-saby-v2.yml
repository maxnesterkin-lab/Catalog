name: Diagnose Saby API - Test 82
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/test-catalog-v82-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout test catalog only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Diagnose 181 missing-stock variants (read only)
        env:
          SABY_APP_ID: ${{ secrets.SABY_APP_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
        run: |
          node <<'JS'
          'use strict';
          const fs = require('node:fs');
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const API = 'https://api.sbis.ru/retail/';
          const stores = [
            {name:'Баумана',pointId:14401,warehouseId:14403,companyId:249},
            {name:'ГУМ',pointId:433,warehouseId:303,companyId:249},
            {name:'Гаджиева',pointId:14406,warehouseId:14408,companyId:249},
            {name:'КТМ',pointId:14179,warehouseId:14000,companyId:249},
            {name:'Крупской',pointId:16974,warehouseId:16976,companyId:249},
            {name:'Книповича',pointId:14412,warehouseId:14414,companyId:249},
            {name:'Кольский',pointId:446,warehouseId:293,companyId:249},
            {name:'Ленина',pointId:409,warehouseId:305,companyId:249},
            {name:'Мир',pointId:11101,warehouseId:11103,companyId:11091},
            {name:'ПЗ',pointId:452,warehouseId:309,companyId:249},
            {name:'Североморск',pointId:18093,warehouseId:18095,companyId:17792},
          ];
          const report = {
            test:82, branch:'test-catalog-v82-20261123',
            mode:'READ_ONLY_NO_PUBLISH', startedAt:new Date().toISOString(),
            source:'data.json schemaVersion=81; direct Saby balances API',
            requestCount:0, targetCount:0, stores:[], controls:[], errors:[],
            completed:false, allRequestsSucceeded:false
          };
          const save = () => fs.writeFileSync('diagnostic-82.json', JSON.stringify(report,null,2));
          const number = v => v == null || typeof v==='boolean' || String(v).trim()==='' || !Number.isFinite(Number(v)) ? null : Number(v);
          const int = v => {const n=number(v);return Number.isSafeInteger(n)&&n>0?n:null;};
          const norm = v => String(v??'').trim().toLowerCase().replace(/ё/g,'е').replace(/^(sv|si)\s+/,'');
          function rows(raw, keys, identity) {
            let v=Array.isArray(raw)?raw:keys.map(k=>raw?.[k]).find(x=>x!=null);
            if (v && !Array.isArray(v) && typeof v==='object')
              v=identity.some(k=>k in v)?[v]:Object.values(v);
            if(!Array.isArray(v)||!v.every(x=>x&&typeof x==='object'&&!Array.isArray(x)))
              throw Error('Unexpected response structure');
            return v;
          }
          const d=JSON.parse(fs.readFileSync('data.json','utf8'));
          if(d.schemaVersion!=='81'||d.previewOnly!==true||d.stores?.length!==stores.length)
            throw Error('Unexpected test catalog snapshot; no API calls performed');
          if(stores.some((s,i)=>s.name!==d.stores[i]))
            throw Error('Store order changed; no API calls performed');
          const positions=d.categories.flatMap(c=>c.items.flatMap(p=>p.flavors));
          const target=positions.filter(f=>Array.isArray(f.stockStatus)&&f.stockStatus.includes('missing'));
          const ids=target.map(f=>int(f.id));
          if(target.length!==181||ids.some(id=>id===null)||new Set(ids).size!==ids.length||
             target.some(f=>f.stockStatus.length!==11||f.stockStatus.some(s=>s!=='missing'))||
             d.verification?.restoredWithUnknownStock!==181)
            throw Error('181-target invariant failed; no API calls performed');
          report.targetCount=ids.length;
          report.snapshotVersion=d.schemaVersion;
          report.snapshotDate=d.updated;
          // Controls are outside the missing-stock target; use only to compare API semantics.
          const controlIds=[3629,3634,6220].filter(id=>!ids.includes(id));
          report.controlIds=controlIds;
          save();

          let token=null, calls=0;
          async function login() {
            const e=process.env;
            if(!e.SABY_APP_ID||!e.SABY_APP_SECRET||!e.SABY_SECRET_KEY)
              throw Error('Missing repository secrets');
            const response=await fetch('https://online.sbis.ru/oauth/service/',{
              method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({app_client_id:e.SABY_APP_ID,app_secret:e.SABY_APP_SECRET,secret_key:e.SABY_SECRET_KEY}),
              redirect:'error',signal:AbortSignal.timeout(20000)
            });
            if(!response.ok) throw Error('Authorization HTTP '+response.status);
            const json=await response.json();
            token=json.token||json.access_token;
            if(typeof token!=='string'||!token) throw Error('Authorization token missing');
            console.log('::add-mask::'+token.replace(/[\r\n]/g,''));
            console.log('Saby authorization OK; token hidden');
          }
          async function get(path,params,label,encoding='repeat') {
            if(++calls>135) throw Error('GET request budget exceeded');
            await sleep(2000); // previous 150 ms pacing caused bursts of HTTP 500
            const url=new URL(path,API);
            for(const [k,v] of Object.entries(params)) {
              if(Array.isArray(v)) {
                if(encoding==='json') url.searchParams.set(k,JSON.stringify(v));
                else for(const x of v)url.searchParams.append(k,String(x));
              }else if(v!=null)url.searchParams.set(k,String(v));
            }
            let response;
            try {
              response=await fetch(url,{headers:{'X-SBISAccessToken':token},redirect:'error',signal:AbortSignal.timeout(20000)});
            }catch{throw Error('Network or timeout');}
            report.requestCount=calls;
            console.log('GET '+calls+' '+label+': HTTP '+response.status);
            if(!response.ok) throw Error('HTTP '+response.status);
            try{return await response.json();}catch{throw Error('Invalid JSON');}
          }
          function balances(raw,asked) {
            const list=rows(raw,['balances','nomenclatures','items','data','result'],['nomenclature']);
            const allowed=new Set(asked), map=new Map();
            for(const r of list) {
              const id=int(r.nomenclature);
              if(id===null||!allowed.has(id)||map.has(id))
                throw Error('Unexpected or duplicated balance ID');
              map.set(id,number(r.balance));
            }
            return map;
          }
          async function direct(store,asked,label) {
            const params={nomenclatures:asked,warehouses:[store.warehouseId],companies:[store.companyId]};
            try {
              const raw=await get('nomenclature/balances',params,label);
              return balances(raw,asked);
            }catch(err) {
              if(err.message!=='HTTP 400'&&err.message!=='HTTP 422') throw err;
              // Some Saby installations accept JSON-encoded arrays rather than repeated keys.
              const raw=await get('nomenclature/balances',params,label+' (JSON arrays)','json');
              return balances(raw,asked);
            }
          }
          function outcome(map,id) {
            if(!map.has(id))return {status:'missing',balance:null};
            const n=map.get(id);
            return n===null?{status:'invalid',balance:null}:
              {status:n>0?'positive':n===0?'zero':'negative',balance:n};
          }
          async function main() {
            await login();
            const points=rows(await get('point/list',{product:'retail',pageSize:100,page:0},'sales points'),['salesPoints'],['id']);
            for(const store of stores) {
              const matched=points.filter(p=>int(p.id)===store.pointId &&
                (norm(p.name)===norm(store.name)||
                (store.name==='Гаджиева'&&norm(p.name)==='гаджиево')));
              if(matched.length!==1)throw Error('Store mapping changed: '+store.name);
            }
            report.pointMappingsVerified=true;
            // Warehouse/company mapping was confirmed in earlier read-only tests 72-74.
            // These IDs are never used for a write, and this run does not assert re-verification.
            report.warehouseMappingSource='Earlier tests 72-74 (not re-verified in this run)';
            save();
            const allIds=[...ids,...controlIds], batchSize=50;
            for(const store of stores) {
              const detail=new Map();
              const entry={name:store.name,pointId:store.pointId,
                companyId:store.companyId,warehouseId:store.warehouseId,
                requestsOK:0,requestsFailed:0,items:[],counts:{positive:0,zero:0,negative:0,missing:0,invalid:0,error:0},
                sampleSingleChecks:[]};
              report.stores.push(entry);
              for(let start=0;start<allIds.length;start+=batchSize) {
                const asked=allIds.slice(start,start+batchSize);
                try {
                  const result=await direct(store,asked,store.name+' batch '+(1+Math.floor(start/batchSize)));
                  for(const id of asked)detail.set(id,{id,...outcome(result,id),source:'batch'});
                  entry.requestsOK++;
                } catch(err) {
                  entry.requestsFailed++;
                  const reason=/^(HTTP [0-9]{3}|Network or timeout|Invalid JSON|Unexpected response structure|Unexpected or duplicated balance ID|GET request budget exceeded)$/.test(err.message)?err.message:'Unexpected API error';
                  report.errors.push({store:store.name,batch:1+Math.floor(start/batchSize),reason});
                  for(const id of asked)detail.set(id,{id,status:'error',balance:null,source:'batch'});
                }
              }
              // Probe a few missing cells individually. A missing bulk row is NOT zero.
              const toProbe=[3628,...ids].filter((id,i,a)=>a.indexOf(id)===i)
                .filter(id=>detail.get(id)?.status==='missing').slice(0,3);
              for(const id of toProbe) {
                try {
                  const single=await direct(store,[id],store.name+' single ID '+id);
                  const x=outcome(single,id);
                  entry.sampleSingleChecks.push({id,...x});
                  if(x.status!=='missing'&&x.status!=='invalid')
                    detail.set(id,{id,...x,source:'single',batchStatus:'missing'});
                } catch(err) {
                  entry.sampleSingleChecks.push({id,status:'error'});
                  report.errors.push({store:store.name,id,reason:'Single-ID check failed'});
                }
              }
              entry.items=ids.map(id=>detail.get(id));
              for(const item of entry.items)entry.counts[item.status]++;
              entry.controls=controlIds.map(id=>detail.get(id));
              console.log(store.name+': '+JSON.stringify(entry.counts)+'; requests failed '+entry.requestsFailed);
              save();
            }
            report.completed=true;
            report.allRequestsSucceeded=report.errors.length===0;
            report.finishedAt=new Date().toISOString();
            report.totals={positive:0,zero:0,negative:0,missing:0,invalid:0,error:0};
            for(const s of report.stores)for(const [k,v] of Object.entries(s.counts))report.totals[k]+=v;
            report.note='This is a live read-only API snapshot, not the 23 Nov warehouse report. Absent or invalid balances are never converted to zero. No data.json/index.html changes.';
            save();
            console.log('Total target cells: '+(ids.length*stores.length));
            console.log('Result totals: '+JSON.stringify(report.totals));
            console.log('NO DATA PUBLISHED OR MODIFIED.');
            if(report.errors.length) process.exitCode=1;
          }
          main().catch(err=>{
            report.fatal=/^(HTTP [0-9]{3}|Network or timeout|Invalid JSON|Unexpected response structure|Missing repository secrets|Authorization token missing|Authorization HTTP [0-9]{3}|GET request budget exceeded)$/.test(err.message)?err.message:'Diagnostics stopped (see validation stage)';
            report.finishedAt=new Date().toISOString();save();
            console.error(report.fatal);process.exitCode=1;
          });
          JS

      - name: Upload diagnostic report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-82
          path: diagnostic-82.json
          if-no-files-found: warn
          retention-days: 7
