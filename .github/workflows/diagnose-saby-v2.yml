name: Check Gadzhieva XROS balances
on:
  push:
    branches: [check-gadzhieva-xros-20261127]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - env:
          SABY_APP_ID: ${{ secrets.SABY_APP_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
        run: |
          node <<'JS'
          const api=require('./update-script').client(process.env);
          (async()=>{
            await api.login();
            for(const ids of [[9187,8906,11041],[9187],[8906],[11041]]){
              const d=await api.get('nomenclature/balances',{nomenclatures:ids,companies:[249],warehouses:[14408]});
              const v=Array.isArray(d)?d:d.balances??d.nomenclatures??d.items??d.data??d.result;
              if(!v || typeof v!=='object')throw Error('Unexpected response fields '+Object.keys(d).join(','));
              const rows=Array.isArray(v)?v:v.nomenclature!=null?[v]:Object.values(v);
              console.log('CHECK',JSON.stringify(ids),JSON.stringify(rows.map(r=>[r.nomenclature,r.balance])), 'hasMore',d.outcome?.hasMore);
            }
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          JS
