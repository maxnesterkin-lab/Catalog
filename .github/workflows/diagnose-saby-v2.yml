name: Diagnose Saby API - Test 86
on:
  push:
    branches:
      - test-catalog-v86-20261123
    paths:
      - .github/workflows/diagnose-saby-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/test-catalog-v86-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout test catalog only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compare point catalog visibility and price lists (read only)
        env:
          SABY_APP_ID: ${{ secrets.SABY_APP_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
        run: |
          node <<'JS'
          'use strict';
          const fs=require('node:fs');
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          const API='https://api.sbis.ru/retail/';
          const STORES=[
            {name:'ГУМ',pointId:433},
            {name:'Гаджиева',pointId:14406},
            {name:'КТМ',pointId:14179},
            {name:'Мир',pointId:11101}
          ];
          const DATE='2026-11-23';
          const report={
            test:86,mode:'READ_ONLY_NO_PUBLISH',branch:'test-catalog-v86-20261123',
            startedAt:new Date().toISOString(),requestCount:0,
            pointChecks:[],priceListChecks:[],folderChecks:[],comparisons:[],
            warnings:[],errors:[],completed:false
          };
          const save=()=>fs.writeFileSync('diagnostic-86.json',JSON.stringify(report,null,2));
          const validInt=x=>{const n=Number(x);return Number.isSafeInteger(n)&&n>0?n:null;};
          const number=x=>(x==null||typeof x==='boolean'||String(x).trim()===''||!Number.isFinite(Number(x)))?null:Number(x);
          const d=JSON.parse(fs.readFileSync('data.json','utf8'));
          if(d.schemaVersion!=='84'||d.previewOnly!==true||!Array.isArray(d.categories)||d.stores?.length!==11||
            d.verification?.liveApiDiagnostic?.fullyUnverifiedProducts!==12)
            throw Error('Unexpected preview snapshot');
          const wanted=d.categories.flatMap(c=>(c.items||[]).flatMap(p=>
            (p.flavors||[]).filter(f=>Array.isArray(f.stockStatus)&&f.stockStatus.length===11&&
              f.stockStatus.every(s=>s==='missing'))
              .map(f=>({id:validInt(f.id),name:String(f.name||''),folderId:validInt(p.folderId),folder:String(p.name||'')}))));
          if(wanted.length!==12||wanted.some(x=>x.id===null||x.folderId===null)||
            new Set(wanted.map(x=>x.id)).size!==12)throw Error('Target list validation failed');
          const folders=[...new Set(wanted.map(x=>x.folderId))];
          report.targetItems=wanted;report.folderIds=folders;save();
          let token=null;
          async function login(){
            const e=process.env;
            if(!e.SABY_APP_ID||!e.SABY_APP_SECRET||!e.SABY_SECRET_KEY)throw Error('Secrets missing');
            const r=await fetch('https://online.sbis.ru/oauth/service/',{
              method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({app_client_id:e.SABY_APP_ID,app_secret:e.SABY_APP_SECRET,secret_key:e.SABY_SECRET_KEY}),
              redirect:'error',signal:AbortSignal.timeout(20000)});
            if(!r.ok)throw Error('Authorization HTTP '+r.status);
            const j=await r.json();token=j.token||j.access_token;
            if(typeof token!=='string'||!token)throw Error('Missing token');
            console.log('::add-mask::'+token.replace(/[\r\n]/g,''));
          }
          async function get(endpoint,params,label){
            report.requestCount++;
            if(report.requestCount>70)throw Error('GET request budget exceeded');
            await sleep(2000);
            const u=new URL(endpoint,API);
            for(const [k,v] of Object.entries(params||{}))if(v!=null)u.searchParams.set(k,String(v));
            const r=await fetch(u,{headers:{'X-SBISAccessToken':token},redirect:'error',signal:AbortSignal.timeout(20000)});
            console.log('GET '+report.requestCount+' '+label+': HTTP '+r.status);
            if(!r.ok)throw Error('HTTP '+r.status);
            return r.json();
          }
          function readRows(raw,fields){
            let found=null;
            if(Array.isArray(raw))found=raw;
            else for(const k of fields)if(raw?.[k]!=null){found=raw[k];break;}
            if(found&&typeof found==='object'&&!Array.isArray(found))
              found=('id' in found||'name' in found)?[found]:Object.values(found);
            if(!Array.isArray(found)||!found.every(x=>x&&typeof x==='object'&&!Array.isArray(x)))
              throw Error('Unexpected result structure');
            return found;
          }
          async function catalog(folder,point,withBalance){
            const params={folder,page:0,pageSize:100,withBalance};
            if(point!=null)params.pointId=point;
            const raw=await get('v2/nomenclature/list',params,
              'folder '+folder+' point '+String(point??'global')+' balance='+withBalance);
            const list=readRows(raw,['nomenclatures','items','data','result']);
            const complete=raw?.outcome?.hasMore===false;
            if(!complete)throw Error('Folder response incomplete (pagination needed)');
            const matches=list.filter(x=>!x.isParent&&wanted.some(y=>y.id===validInt(x.id)&&y.folderId===folder));
            if(new Set(matches.map(x=>validInt(x.id))).size!==matches.length)
              throw Error('Duplicate exact IDs');
            return {rowCount:list.length,complete,items:matches.map(x=>({
              id:validInt(x.id),name:String(x.name||''),published:x.published??null,
              balanceFieldPresent:Object.prototype.hasOwnProperty.call(x,'balance'),balance:number(x.balance)
            }))};
          }
          async function main(){
            await login();
            const points=readRows(await get('point/list',{product:'retail',pageSize:100,page:0},'sales points'),['salesPoints']);
            for(const s of STORES){
              const p=points.find(x=>validInt(x.id)===s.pointId);
              if(!p)throw Error('Sales point no longer exists: '+s.name);
              report.pointChecks.push({name:s.name,pointId:s.pointId,apiName:String(p.name||'')});
            }
            save();
            for(const s of STORES){
              const item={store:s.name,pointId:s.pointId,date:DATE};
              try{
                const raw=await get('nomenclature/price-list',
                  {pointId:s.pointId,actualDate:DATE,page:0,pageSize:25},s.name+' price list');
                const fieldNames=Object.keys(raw||{});
                item.responseKeys=fieldNames;
                let list=null;
                for(const k of ['priceLists','priceList','priceListItems','prices','items','data','result'])
                  if(raw?.[k]!=null){list=raw[k];break;}
                if(Array.isArray(raw))list=raw;
                if(list&&typeof list==='object'&&!Array.isArray(list))list=Object.values(list);
                item.rows=Array.isArray(list)?list.length:null;
                item.sample=Array.isArray(list)?list.slice(0,15).map(x=>({
                  id:validInt(x?.id),name:String(x?.name??'').slice(0,100)})):[];
                item.hasMore=raw?.outcome?.hasMore??null;
              }catch(e){item.error=String(e.message).slice(0,95);report.warnings.push({
                scope:'priceList',store:s.name,reason:item.error});}
              report.priceListChecks.push(item);save();
            }
            for(const folder of folders){
              const base={folderId:folder,context:'global',withBalance:false};
              try{Object.assign(base,await catalog(folder,null,false));}
              catch(e){base.error=String(e.message).slice(0,95);report.errors.push(base.error);}
              report.folderChecks.push(base);save();
              for(const s of STORES)for(const flag of [false,true]){
                const item={folderId:folder,context:s.name,pointId:s.pointId,withBalance:flag};
                try{Object.assign(item,await catalog(folder,s.pointId,flag));}
                catch(e){item.error=String(e.message).slice(0,95);report.errors.push(item.error);}
                report.folderChecks.push(item);save();
              }
            }
            const globalIds=new Set(report.folderChecks
              .filter(x=>x.context==='global'&&!x.error).flatMap(x=>x.items.map(z=>z.id)));
            report.globalConfirmed=globalIds.size;
            const scans=report.folderChecks.filter(x=>x.context!=='global');
            report.pointNoBalanceFound=scans.filter(x=>x.withBalance===false).reduce((n,x)=>n+(x.items?.length||0),0);
            report.pointWithBalanceFound=scans.filter(x=>x.withBalance===true).reduce((n,x)=>n+(x.items?.length||0),0);
            for(const target of wanted){
              const row={id:target.id,folderId:target.folderId,
                globalFound:globalIds.has(target.id),stores:[]};
              for(const s of STORES){
                const before=scans.find(x=>x.context===s.name&&x.folderId===target.folderId&&x.withBalance===false);
                const after=scans.find(x=>x.context===s.name&&x.folderId===target.folderId&&x.withBalance===true);
                row.stores.push({name:s.name,
                  withoutBalance:before?.error?'error':!!before?.items?.some(x=>x.id===target.id),
                  withBalance:after?.error?'error':!!after?.items?.some(x=>x.id===target.id)});
              }
              report.comparisons.push(row);
            }
            report.completed=true;
            report.finishedAt=new Date().toISOString();
            report.note='Read-only comparison of pointId + withBalance flags and local price lists. No absent item is interpreted as zero. No catalog files modified.';
            save();
            console.log('Target IDs: '+wanted.length+'; global found: '+report.globalConfirmed);
            console.log('Point folder matches withoutBalance='+report.pointNoBalanceFound+
              '; withBalance='+report.pointWithBalanceFound);
            console.log('Errors '+report.errors.length+'; warnings '+report.warnings.length);
            console.log('NO DATA PUBLISHED OR MODIFIED.');
            if(report.errors.length||report.globalConfirmed!==wanted.length)process.exitCode=1;
          }
          main().catch(err=>{
            report.fatal=String(err.message).slice(0,100);report.finishedAt=new Date().toISOString();
            save();console.error('Diagnostic failure: '+report.fatal);process.exitCode=1;
          });
          JS
      - name: Upload diagnostic report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-86
          path: diagnostic-86.json
          if-no-files-found: warn
          retention-days: 7
