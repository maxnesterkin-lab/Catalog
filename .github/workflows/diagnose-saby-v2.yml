name: Diagnose Saby API - XROS stock check
on:
  push:
    branches:
      - test-catalog-v82-20261123
    paths:
      - .github/workflows/diagnose-saby-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/test-catalog-v82-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout test catalog only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compare XROS balances by warehouse (read only)
        env:
          SABY_APP_ID: ${{ secrets.SABY_APP_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
        run: |
          node <<'JS'
          'use strict';
          const fs = require('node:fs');
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const API = 'https://api.sbis.ru/retail/';
          const stores = [
            {name:'Баумана',pointId:14401,warehouseId:14403,companyId:249},
            {name:'Гаджиева',pointId:14406,warehouseId:14408,companyId:249},
            {name:'КТМ',pointId:14179,warehouseId:14000,companyId:249},
          ];
          const report = {
            test:'xros-stock', branch:'test-catalog-v82-20261123',
            mode:'READ_ONLY_NO_PUBLISH', startedAt:new Date().toISOString(),
            source:'Saby Retail balances API',
            requestCount:0, stores:[], errors:[],
            completed:false, allRequestsSucceeded:false
          };
          const save = () => fs.writeFileSync('diagnostic-xros.json', JSON.stringify(report,null,2));
          const number = v => v == null || typeof v==='boolean' || String(v).trim()==='' || !Number.isFinite(Number(v)) ? null : Number(v);
          const int = v => {const n=number(v);return Number.isSafeInteger(n)&&n>0?n:null;};
          const norm = v => String(v??'').trim().toLowerCase().replace(/ё/g,'е').replace(/^(sv|si)\s+/,'');
          function rows(raw, keys, identity) {
            let v=Array.isArray(raw)?raw:keys.map(k=>raw?.[k]).find(x=>x!=null);
            if (v && !Array.isArray(v) && typeof v==='object')
              v=identity.some(k=>k in v)?[v]:Object.values(v);
            if(!Array.isArray(v)||!v.every(x=>x&&typeof x==='object'&&!Array.isArray(x)))
              throw Error('Unexpected response structure');
            return v;
          }
          const ids = [101, 14391]; // XROS 3 Black, XROS 5 Kit Brown Leather
          report.products = {101:'XROS 3 Black',14391:'XROS 5 Kit Brown Leather'};
          const catalog = JSON.parse(fs.readFileSync('data.json','utf8'));
          const products = catalog.categories.flatMap(c=>c.items.flatMap(p=>p.flavors));
          for (const id of ids) {
            const matches = products.filter(f=>int(f.id)===id);
            if (matches.length!==1 || norm(matches[0].name.replace(/[^\p{L}\p{N} ]/gu,' ').replace(/ +/g,' '))!==norm(report.products[id].toLowerCase()))
              throw Error('Unexpected catalog product '+id);
          }
          save();

          let token=null, calls=0;
          async function login() {
            const e=process.env;
            if(!e.SABY_APP_ID||!e.SABY_APP_SECRET||!e.SABY_SECRET_KEY)
              throw Error('Missing repository secrets');
            const response=await fetch('https://online.sbis.ru/oauth/service/',{
              method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({app_client_id:e.SABY_APP_ID,app_secret:e.SABY_APP_SECRET,secret_key:e.SABY_SECRET_KEY}),
              redirect:'error',signal:AbortSignal.timeout(20000)
            });
            if(!response.ok) throw Error('Authorization HTTP '+response.status);
            const json=await response.json();
            token=json.token||json.access_token;
            if(typeof token!=='string'||!token) throw Error('Authorization token missing');
            console.log('::add-mask::'+token.replace(/[\r\n]/g,''));
            console.log('Saby authorization OK; token hidden');
          }
          async function get(path,params,label,encoding='repeat') {
            if(++calls>24) throw Error('GET request budget exceeded');
            report.requestCount=calls;
            await sleep(2000); // previous 150 ms pacing caused bursts of HTTP 500
            const url=new URL(path,API);
            for(const [k,v] of Object.entries(params)) {
              if(Array.isArray(v)) {
                if(encoding==='json') url.searchParams.set(k,JSON.stringify(v));
                else for(const x of v)url.searchParams.append(k,String(x));
              }else if(v!=null)url.searchParams.set(k,String(v));
            }
            let response;
            try {
              response=await fetch(url,{headers:{'X-SBISAccessToken':token},redirect:'error',signal:AbortSignal.timeout(20000)});
            }catch{throw Error('Network or timeout');}
            console.log('GET '+calls+' '+label+': HTTP '+response.status);
            if(!response.ok) throw Error('HTTP '+response.status);
            try{return await response.json();}catch{throw Error('Invalid JSON');}
          }
          function balances(raw,asked) {
            const list=rows(raw,['balances','nomenclatures','items','data','result'],['nomenclature']);
            const allowed=new Set(asked), map=new Map();
            for(const r of list) {
              const id=int(r.nomenclature);
              if(id===null||!allowed.has(id)||map.has(id))
                throw Error('Unexpected or duplicated balance ID');
              map.set(id,number(r.balance));
            }
            return map;
          }
          async function direct(store,asked,label) {
            const params={nomenclatures:asked,warehouses:[store.warehouseId],companies:[store.companyId]};
            try {
              const raw=await get('nomenclature/balances',params,label);
              return balances(raw,asked);
            }catch(err) {
              if(err.message!=='HTTP 400'&&err.message!=='HTTP 422') throw err;
              // Some Saby installations accept JSON-encoded arrays rather than repeated keys.
              const raw=await get('nomenclature/balances',params,label+' (JSON arrays)','json');
              return balances(raw,asked);
            }
          }
          function outcome(map,id) {
            if(!map.has(id))return {status:'missing',balance:null};
            const n=map.get(id);
            return n===null?{status:'invalid',balance:null}:
              {status:n>0?'positive':n===0?'zero':'negative',balance:n};
          }
          async function main() {
            await login();
            const points=rows(await get('point/list',{product:'retail',pageSize:100,page:0},'sales points'),['salesPoints'],['id']);
            for(const store of stores) {
              const matched=points.filter(p=>int(p.id)===store.pointId &&
                (norm(p.name)===norm(store.name)||
                (store.name==='Гаджиева'&&norm(p.name)==='гаджиево')));
              if(matched.length!==1)throw Error('Store mapping changed: '+store.name);
            }
            report.pointMappingsVerified=true;
            // Warehouse/company mapping was confirmed in earlier read-only tests 72-74.
            // These IDs are never used for a write, and this run does not assert re-verification.
            report.warehouseMappingSource='Earlier tests 72-74 (not re-verified in this run)';
            save();
            for (const store of stores) {
              const checks = [];
              report.stores.push({name:store.name, warehouseId:store.warehouseId, checks});
              for (const asked of [ids, ...ids.map(id=>[id])]) {
                const label = asked.length>1?'batch':'single';
                try {
                  const result = await direct(store,asked,store.name+' '+label+' '+asked.join(','));
                  checks.push({mode:label,items:asked.map(id=>({id,...outcome(result,id)}))});
                } catch (error) {
                  report.errors.push({store:store.name,mode:label,ids:asked,reason:error.message});
                  checks.push({mode:label,items:asked.map(id=>({id,status:'error',balance:null}))});
                }
                console.log('XROS_RESULT '+JSON.stringify({store:store.name,...checks.at(-1)}));
                save();
              }
            }
            report.completed=true;
            report.allRequestsSucceeded=report.errors.length===0;
            report.finishedAt=new Date().toISOString();
            save();
            if(report.errors.length) process.exitCode=1;
          }
          main().catch(err=>{
            report.fatal=/^(HTTP [0-9]{3}|Network or timeout|Invalid JSON|Unexpected response structure|Missing repository secrets|Authorization token missing|Authorization HTTP [0-9]{3}|GET request budget exceeded)$/.test(err.message)?err.message:'Diagnostics stopped (see validation stage)';
            report.finishedAt=new Date().toISOString();save();
            console.error(report.fatal);process.exitCode=1;
          });
          JS

      - name: Upload diagnostic report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-xros
          path: diagnostic-xros.json
          if-no-files-found: warn
          retention-days: 7
