          const ids=config.products.map(p=>p[0]);
          const folderById=new Map(config.products);
          const limits={missing:3,negative:3,invalid:2,zero:1,positive:1};
          const categories=['positive','zero','negative','missing','invalid'];
          function classify(r){return !r.returned?'missing':r.value===null?'invalid':r.value>0?'positive':r.value===0?'zero':'negative';}
          function counts(){return Object.fromEntries(categories.map(k=>[k,0]));}
          function choose(list, r, source){
            const category=classify(r);
            if(list.some(x=>x.id===r.id)||list.filter(x=>x.category===category&&x.source===source).length>=limits[category])return;
            list.push({id:r.id,folder:folderById.get(r.id),category,source,prior:r});
          }
          async function main(){
            if(ids.length!==7014||new Set(ids).size!==ids.length)throw Error('Invalid prior catalogue');
            report.sourceProductCount=ids.length;report.expectedBatches=config.expectedBatches;report.priorCoverage=config.prior;save();
            await login();
            const points=rows(await get('point/list',{product:'retail',pageSize:100,page:0},'point list'),['salesPoints'],['id']);
            report.mapping=stores.map(m=>({...m,companyId:m.companies[0],verifiedPoint:points.some(p=>integer(p.id)===m.pointId&&(norm(p.name)===norm(m.name)||m.name==='Гаджиева'&&norm(p.name)==='гаджиево'))}));
            if(!report.mapping.every(m=>m.verifiedPoint))throw Error('Point mapping changed; stopped safely');
            const picked=new Map();
            for(const m of report.mapping){
              const prior=config.prior[m.name], start=prior.covered;
              const s={store:m.name,companyId:m.companyId,warehouseId:m.warehouseId,expected:ids.length,priorCovered:start,newCovered:0,priorCounts:prior.counts,newCounts:counts(),newBatches:0};
              report.summary.push(s);const list=[...config.examples[m.name]];picked.set(m.name,list);
              for(let i=start;i<ids.length;i+=batchSize){
                const batch=ids.slice(i,i+batchSize);
                const raw=await attempt('batch '+m.name+' offset '+i,()=>newBalances(m,[m.companyId],batch));
                const results=batch.map(id=>({id,...stock(raw,id)}));
                report.batches.push({store:m.name,offset:i,requestOK:raw!==null,results});
                if(raw===null){save();throw Error('Batch failed at '+m.name+' offset '+i+'; saved partial report');}
                for(const r of results){s.newCounts[classify(r)]++;choose(list,r,74);}
                s.newCovered+=batch.length;s.newBatches++;save();
              }
              s.combinedCovered=s.priorCovered+s.newCovered;
              s.combinedCounts=Object.fromEntries(categories.map(k=>[k,(s.priorCounts[k]??0)+s.newCounts[k]]));
            }
            report.coverageComplete=report.summary.length===11&&report.summary.every(s=>s.combinedCovered===ids.length)&&report.batches.length===config.expectedBatches&&report.batches.every(b=>b.requestOK);save();
            if(!report.coverageComplete)throw Error('Coverage verification failed');
            // Small stratified samples: historical exceptional outcomes + new exceptional outcomes.
            // Missing is never treated as zero. Compare old, grouped, and individual for exceptional cases.
            for(const m of report.mapping){
              const list=picked.get(m.name), probeIds=list.map(x=>x.id);
              if(!probeIds.length)continue;
              const groups=await attempt('probe group '+m.name,()=>newBalances(m,[m.companyId],probeIds));
              const oldMaps=new Map();
              for(const f of new Set(list.map(x=>x.folder))){
                const a=await attempt('old probe '+m.name+' folder '+f,async()=>balanceMap((await readFolder(f,m.pointId,true)).filter(x=>!x.isParent),'id'));
                oldMaps.set(f,a);
              }
              for(const x of list){
                const unusual=['missing','negative','invalid'].includes(x.category);
                const single=unusual?await attempt('probe single '+m.name+' '+x.id,()=>newBalances(m,[m.companyId],[x.id])):null;
                const group=stock(groups,x.id), old=stock(oldMaps.get(x.folder),x.id), individual=unusual?stock(single,x.id):null;
                report.comparisons.push({...x,store:m.name,old,group,individual,groupOK:groups!==null,oldOK:oldMaps.get(x.folder)!==null,singleOK:unusual?single!==null:null,quantity:compare(old.value,group.value),availability:presence(old.value,group.value),singleVsGroup:unusual?compare(individual.value,group.value):null});save();
              }
            }
            report.probesOK=report.comparisons.length>0&&report.comparisons.every(x=>x.groupOK&&x.oldOK&&x.singleOK!==false);
            report.complete=report.coverageComplete&&report.probesOK;
            report.note='Combined coverage is from two runs, not a simultaneous inventory snapshot. Missing and invalid remain unknown. Samples cannot establish universal stock semantics.';
            save();if(!report.complete)throw Error('Some comparison requests failed; report retained');
          }
          main().catch(e=>{report.fatal=e.message;save();console.error(e.message);process.exitCode=1;});
