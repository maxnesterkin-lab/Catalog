name: Diagnose Saby API - XROS Bauman
on:
  push:
    branches:
      - saby-check-xros-baumana-20261124
    paths:
      - .github/workflows/diagnose-saby-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/saby-check-xros-baumana-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read XROS balances for Bauman warehouse
        env:
          SABY_APP_ID: ${{ secrets.SABY_APP_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
        run: |
          node <<'JS'
          'use strict';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const API = 'https://api.sbis.ru/retail/';
          const store = {name:'Баумана',pointId:14401,warehouseId:14403,companyId:249};
          const cases = [
            {id:14391,label:'XROS 5 Kit Brown Leather',photoBalance:2},
            {id:101,label:'XROS 3 Black'}
          ];
          let token=null, calls=0;
          const number = v => v == null || typeof v==='boolean' || String(v).trim()==='' || !Number.isFinite(Number(v)) ? null : Number(v);
          const int = v => {const n=number(v);return Number.isSafeInteger(n)&&n>0?n:null;};
          const norm = v => String(v??'').trim().toLowerCase().replace(/ё/g,'е').replace(/^(sv|si)\s+/,'');
          function rows(raw, keys, identity) {
            let v=Array.isArray(raw)?raw:keys.map(k=>raw?.[k]).find(x=>x!=null);
            if (v && !Array.isArray(v) && typeof v==='object')
              v=identity.some(k=>k in v)?[v]:Object.values(v);
            if(!Array.isArray(v)||!v.every(x=>x&&typeof x==='object'&&!Array.isArray(x)))
              throw Error('Unexpected response structure');
            return v;
          }
          async function login() {
            const e=process.env;
            if(!e.SABY_APP_ID||!e.SABY_APP_SECRET||!e.SABY_SECRET_KEY)
              throw Error('Missing repository secrets');
            const response=await fetch('https://online.sbis.ru/oauth/service/',{
              method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({app_client_id:e.SABY_APP_ID,app_secret:e.SABY_APP_SECRET,secret_key:e.SABY_SECRET_KEY}),
              redirect:'error',signal:AbortSignal.timeout(20000)
            });
            if(!response.ok) throw Error('Authorization HTTP '+response.status);
            const json=await response.json();
            token=json.token||json.access_token;
            if(typeof token!=='string'||!token) throw Error('Authorization token missing');
            console.log('::add-mask::'+token.replace(/[\r\n]/g,''));
            console.log('Saby authorization OK; token hidden');
          }
          async function get(path,params,label,encoding='repeat') {
            if(++calls>24) throw Error('GET request budget exceeded');
            await sleep(2000); // previous 150 ms pacing caused bursts of HTTP 500
            const url=new URL(path,API);
            for(const [k,v] of Object.entries(params)) {
              if(Array.isArray(v)) {
                if(encoding==='json') url.searchParams.set(k,JSON.stringify(v));
                else for(const x of v)url.searchParams.append(k,String(x));
              }else if(v!=null)url.searchParams.set(k,String(v));
            }
            let response;
            try {
              response=await fetch(url,{headers:{'X-SBISAccessToken':token},redirect:'error',signal:AbortSignal.timeout(20000)});
            }catch{throw Error('Network or timeout');}
            console.log('GET '+calls+' '+label+': HTTP '+response.status);
            if(!response.ok) throw Error('HTTP '+response.status);
            try{return await response.json();}catch{throw Error('Invalid JSON');}
          }
          function balances(raw,asked) {
            const list=rows(raw,['balances','nomenclatures','items','data','result'],['nomenclature']);
            const allowed=new Set(asked), map=new Map();
            for(const r of list) {
              const id=int(r.nomenclature);
              if(id===null||!allowed.has(id)||map.has(id))
                throw Error('Unexpected or duplicated balance ID');
              map.set(id,number(r.balance));
            }
            return map;
          }
          async function direct(store,asked,label) {
            const params={nomenclatures:asked,warehouses:[store.warehouseId],companies:[store.companyId]};
            try {
              const raw=await get('nomenclature/balances',params,label);
              return balances(raw,asked);
            }catch(err) {
              if(err.message!=='HTTP 400'&&err.message!=='HTTP 422') throw err;
              // Some Saby installations accept JSON-encoded arrays rather than repeated keys.
              const raw=await get('nomenclature/balances',params,label+' (JSON arrays)','json');
              return balances(raw,asked);
            }
          }
          function outcome(map,id) {
            if(!map.has(id))return {status:'missing',balance:null};
            const n=map.get(id);
            return n===null?{status:'invalid',balance:null}:
              {status:n>0?'positive':n===0?'zero':'negative',balance:n};
          }

          async function priceListIds(store) {
            const lists = new Set();
            const actualDate = new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Moscow'}).format(new Date());
            for(let page=0;;page++){
              const raw=await get('nomenclature/price-list',{pointId:store.pointId,actualDate,page,pageSize:100},store.name+' price lists');
              const list=rows(raw,['priceLists','priceList','priceListItems','prices','items','data','result'],['id']);
              for(const row of list){
                const id=int(row.id);
                if(!id||lists.has(id))throw Error('Invalid or repeated price list ID');
                lists.add(id);
              }
              if(raw?.outcome?.hasMore===false || (raw?.outcome?.hasMore!==true && list.length<100))return [...lists];
              if(!list.length)throw Error('Invalid price list pagination');
            }
          }
          async function byPriceList(store, listId, targetIds){
            const params={priceListIds:[listId],warehouses:[store.warehouseId],companies:[store.companyId]};
            const raw=await get('nomenclature/balances',params,store.name+' balances by price list');
            const result=new Map();
            for(const row of rows(raw,['balances','nomenclatures','items','data','result'],['nomenclature'])){
              const id=int(row.nomenclature);
              if(!targetIds.has(id))continue;
              const value=number(row.balance);
              if(result.has(id)&&result.get(id)!==value)throw Error('Conflicting balance rows');
              result.set(id,value);
            }
            return result;
          }
          function reportResult(label, item, balancesById) {
            const result = outcome(balancesById, item.id);
            const comparison = item.photoBalance === undefined || result.balance === null
              ? '' : '; matches photographed warehouse balance: '+(result.balance===item.photoBalance);
            console.log(label+' '+item.label+': '+result.status+comparison);
          }

          async function main() {
            await login();
            const points=rows(await get('point/list',{product:'retail',pageSize:100,page:0},'sales points'),['salesPoints'],['id']);
            if(points.filter(point=>int(point.id)===store.pointId && norm(point.name)===norm(store.name)).length!==1)
              throw Error('Store mapping changed');

            for(const item of cases) {
              try {
                reportResult('Direct',item,await direct(store,[item.id],item.label+' single ID'));
              } catch(error) {
                console.log('Direct '+item.label+': '+safeError(error));
                process.exitCode=1;
              }
            }

            const ids = new Set(cases.map(item=>item.id));
            const batch = await direct(store, [...ids], 'XROS warehouse batch');
            for (const item of cases) reportResult('Batch', item, batch);
            const priceLists = await priceListIds(store);
            console.log('Active price lists: '+priceLists.length);
            for(const listId of priceLists) {
              const values = await byPriceList(store,listId,ids);
              for(const item of cases) reportResult('Price list '+listId,item,values);
            }
          }

          function safeError(error) {
            const message = String(error?.message);
            return /^(HTTP [0-9]{3}|Network or timeout|Invalid JSON|Unexpected response structure|Missing repository secrets|Authorization token missing|Authorization HTTP [0-9]{3}|GET request budget exceeded|Store mapping changed)$/.test(message)
              ? message : 'Unexpected API response';
          }

          main().catch(error=>{
            console.error('Diagnostics stopped: '+safeError(error));
            process.exitCode=1;
          });
          JS
