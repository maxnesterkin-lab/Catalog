name: Diagnose Saby API - Test 74
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: startsWith(github.ref, 'refs/heads/saby-test-74-')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test 74 - read-only resume and exceptional balance checks
        timeout-minutes: 140
        env:
          SABY_APP_ID: ${{ secrets.SABY_APP_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const report = {test:74,sourceTest:73,checks:[],mapping:[],summary:[],batches:[],comparisons:[],coverageComplete:false,complete:false};
          const save = () => fs.writeFileSync('diagnostic-74.json', JSON.stringify(report,null,2));
          const sleep = ms => new Promise(r=>setTimeout(r,ms));
          const base = 'https://api.sbis.ru/retail/';
          const stores = [{"name":"Баумана","pointId":14401,"warehouseId":14403,"companies":[249,14401]},{"name":"ГУМ","pointId":433,"warehouseId":303,"companies":[249,433]},{"name":"Гаджиева","pointId":14406,"warehouseId":14408,"companies":[249,14406]},{"name":"КТМ","pointId":14179,"warehouseId":14000,"companies":[249,14179]},{"name":"Крупской","pointId":16974,"warehouseId":16976,"companies":[249,16974]},{"name":"Книповича","pointId":14412,"warehouseId":14414,"companies":[249,14412]},{"name":"Кольский","pointId":446,"warehouseId":293,"companies":[249,446]},{"name":"Ленина","pointId":409,"warehouseId":305,"companies":[249,409]},{"name":"Мир","pointId":11101,"warehouseId":11103,"companies":[11091,11101]},{"name":"ПЗ","pointId":452,"warehouseId":309,"companies":[249,452]},{"name":"Североморск","pointId":18093,"warehouseId":18095,"companies":[17792,18093]}];
          const samples = [{"folder":11164,"ids":[11172,11178,11176,11180,11175]},{"folder":11835,"ids":[11772,11773,11774,11775,11776]},{"folder":14496,"ids":[6220,6217,13756]}];
          let token, count=0;
          const norm = v=>String(v??'').toLowerCase().replace(/ё/g,'е').replace(/^(sv|si|severvape|север вейп)\s+/,'').trim();
          const number = x => x==null || typeof x==='boolean' || String(x).trim()==='' || !Number.isFinite(Number(x)) ? null : Number(x);
          const integer = x => { const n=number(x); return Number.isSafeInteger(n)&&n>0?n:null; };
          const objectKeys = d=>d && typeof d==='object'?Object.keys(d).slice(0,20):[];
          function rows(d, keys, idKeys){
            let v=Array.isArray(d)?d:keys.map(k=>d?.[k]).find(x=>x!=null);
            if(v&&typeof v==='object'&&!Array.isArray(v)) v=idKeys.some(k=>k in v)?[v]:Object.values(v);
            if(!Array.isArray(v)||!v.every(x=>x&&typeof x==='object'&&!Array.isArray(x))) throw Error('Unrecognized response structure: '+objectKeys(d).join(','));
            return v;
          }
          async function login(){
            const e=process.env;
            if(!e.SABY_APP_ID||!e.SABY_APP_SECRET||!e.SABY_SECRET_KEY) throw Error('Missing repository secrets');
            const r=await fetch('https://online.sbis.ru/oauth/service/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app_client_id:e.SABY_APP_ID,app_secret:e.SABY_APP_SECRET,secret_key:e.SABY_SECRET_KEY}),redirect:'error',signal:AbortSignal.timeout(15000)});
            if(!r.ok) throw Error('Authorization HTTP '+r.status);
            const d=await r.json();token=d.token||d.access_token;if(typeof token!=='string'||!token)throw Error('No access token');
            console.log('Authorization successful');
          }
          async function get(path,params,label,encoding='repeat'){
            if(count>=1200) throw Error('Request budget exhausted; partial report only');
            ++count;
            if(count>1200) throw Error('Request budget exceeded');
            await sleep(2000);
            const u=new URL(path,base);
            for(const [k,v] of Object.entries(params)) {
              if(Array.isArray(v)){if(encoding==='json')u.searchParams.set(k,JSON.stringify(v));else for(const x of v)u.searchParams.append(k,String(x));}
              else if(v!=null)u.searchParams.set(k,String(v));
            }
            const rec={number:count,label,status:null,ms:null};let start=Date.now();
            try{
              const r=await fetch(u,{headers:{'X-SBISAccessToken':token},redirect:'error',signal:AbortSignal.timeout(12000)});rec.status=r.status;
              if(!r.ok)throw Error('HTTP '+r.status);
              return await r.json();
            } catch(e){throw Error(rec.status&&!String(e.message).startsWith('HTTP')?'Invalid response or JSON':rec.status?'HTTP '+rec.status:'Network or timeout');}
            finally{rec.ms=Date.now()-start;report.checks.push(rec);console.log(`${rec.number} ${label}: ${rec.status??'network'} (${rec.ms} ms)`);if(count%10===0)save();}
          }
          async function attempt(label,fn){try{return await fn();}catch(e){console.log(label+': '+e.message);report.checks.push({label,error:e.message});save();return null;}}
          async function catalog(folder,pointId,withBalance){
            const out=[],seen=new Set();
            for(let page=0;page<40;page++){
              const d=await get('v2/nomenclature/list',{folder,pointId,withBalance,page,pageSize:25},`catalog ${folder} point=${pointId??'global'} page=${page}`);
              const a=rows(d,['nomenclatures'],['id']);
              for(const x of a){if(x.isParent)continue;const id=integer(x.id);if(id==null||seen.has(id))throw Error('Missing or duplicate catalog ID');seen.add(id);out.push(x);}
              const more=typeof d.outcome==='boolean'?d.outcome:d.outcome?.hasMore;
              if(more===false)return out;
              if(more!==true||!a.length)throw Error('Pagination uncertain');
            }throw Error('Page budget exceeded');
          }
          function balanceMap(a, key){const m=new Map();for(const x of a){const id=integer(x[key]);if(id==null||m.has(id))throw Error('Missing or duplicate balance ID');m.set(id,number(x.balance));}return m;}
          async function newBalances(m, companies, ids){
            const label='direct '+m.name+' company='+companies.join(',');
            const params={nomenclatures:ids,warehouses:[m.warehouseId],companies};
            let raw;
            try { raw=await get('nomenclature/balances',params,label); }
            catch(e){
              if(!['HTTP 400','HTTP 422'].includes(e.message))throw e;
              raw=await get('nomenclature/balances',params,label+' JSON arrays','json');
            }
            const arr=rows(raw,['balances','nomenclatures','items','data','result'],['nomenclature']);
            const balances=balanceMap(arr,'nomenclature');
            if([...balances.keys()].some(id=>!ids.includes(id)))throw Error('Unexpected product ID in balance response');
            return balances;
          }
          const focusId=6220, focusFolder=14496, batchSize=50;
          async function readFolder(folder, pointId, withBalance){
            const out=[],seen=new Set(); let position=null, cursor=false;
            for(let i=0;i<400;i++){
              const nav=cursor?{order:'after',position,pageSize:25}:{page:i,pageSize:25};
              const raw=await get('v2/nomenclature/list',{folder,pointId,withBalance,...nav},`folder ${folder??'root'} point=${pointId??'global'} ${cursor?'after '+position:'page '+i}`);
              const list=rows(raw,['nomenclatures'],['id']);
              for(const x of list){
                const id=integer(x.isParent?(x.hierarchicalId??x.id):x.id);
                const k=(x.isParent?'folder:':'product:')+id;
                if(id===null||seen.has(k))throw Error('Missing or duplicate row in folder '+folder);
                seen.add(k);out.push(x);
              }
              const more=typeof raw.outcome==='boolean'?raw.outcome:raw.outcome?.hasMore;
              if(more===false)return out;
              if(more!==true||!list.length)throw Error('Pagination uncertain for folder '+folder);
              if(i>=39||cursor){const next=integer(list.at(-1).hierarchicalId);if(next===null||next===position)throw Error('Cursor unavailable or stalled');position=next;cursor=true;}
            }
            throw Error('Folder page budget exceeded');
          }
          function stock(m,id){return {returned:m?.has(id)??false,value:m?.get(id)??null};}
          function compare(a,b){return a===null||b===null?'unknown':a===b?'equal':'different';}
          function presence(a,b){return a===null||b===null?'unknown':(a>0)===(b>0)?'equal':'different';}
          
