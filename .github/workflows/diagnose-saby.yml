name: Diagnose Saby API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read-only API diagnostics
        env:
          SABY_APP_ID: ${{ secrets.SABY_APP_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
        run: |
          node <<'JS'
          const base = 'https://api.sbis.ru/retail/';
          let token;
          let errors = 0;
          const env = process.env;
          const safeKeys = obj => Object.keys(obj || {}).filter(k => /^[a-zA-Z][a-zA-Z0-9_]{0,40}$/.test(k)).slice(0, 20).join(', ');
          function rows(data, keys) {
            if (Array.isArray(data)) return data;
            for (const k of keys) {
              const v = data?.[k];
              if (Array.isArray(v)) return v;
              if (v && typeof v === 'object') {
                if ('id' in v || 'name' in v) return [v];
                const vals = Object.values(v);
                if (vals.every(x => x && typeof x === 'object' && !Array.isArray(x))) return vals;
              }
            }
            return null;
          }
          const central = x => /(^|\s)центр(\s|$)|центральн/i.test(String(x?.name ?? x?.warehouseName ?? x?.title ?? '').replace(/[^\p{L}\p{N}]+/gu, ' '));
          async function get(label, path, params = {}) {
            const url = new URL(path, base);
            for (const [k,v] of Object.entries(params)) url.searchParams.set(k, String(v));
            try {
              const res = await fetch(url, {headers: {'X-SBISAccessToken': token}, redirect: 'error', signal: AbortSignal.timeout(15000)});
              console.log(`${label}: HTTP ${res.status}`);
              if (!res.ok) { errors++; return null; }
              return await res.json();
            } catch { console.log(`${label}: network/JSON error`); errors++; return null; }
          }
          async function main() {
            if (!env.SABY_APP_ID || !env.SABY_APP_SECRET || !env.SABY_SECRET_KEY) throw Error('missing GitHub secrets');
            const res = await fetch('https://online.sbis.ru/oauth/service/', {
              method: 'POST', headers: {'Content-Type': 'application/json'}, redirect: 'error', signal: AbortSignal.timeout(15000),
              body: JSON.stringify({app_client_id: env.SABY_APP_ID, app_secret: env.SABY_APP_SECRET, secret_key: env.SABY_SECRET_KEY})
            });
            console.log(`Authorization: HTTP ${res.status}`);
            if (!res.ok) throw Error('authorization failed');
            const auth = await res.json();
            token = auth.token || auth.access_token;
            if (!token || typeof token !== 'string') throw Error('no access token');
            console.log('::add-mask::' + token.replace(/[\r\n]/g, ''));
            const p = await get('Sales points', 'point/list', {product:'retail', pageSize:100, page:0});
            const points = rows(p, ['salesPoints']);
            if (points) console.log(`Sales points (first page): ${points.length}; CENTER match: ${points.some(central)}; more: ${p?.outcome?.hasMore === true}`);
            else if (p) console.log('Sales points: unrecognized response fields: ' + safeKeys(p));
            const c = await get('Companies', 'company/list');
            const companies = rows(c, ['companies','company','organizations','items','data','result']);
            if (companies) {
              console.log(`Companies returned: ${companies.length}`);
              for (const [i, company] of companies.slice(0, 15).entries()) {
                const id = company.id ?? company.companyId;
                if (id == null || !['number','string'].includes(typeof id)) { console.log(`Company ${i+1}: unrecognized ID fields: ${safeKeys(company)}`); continue; }
                const w = await get(`Warehouses, company ${i+1}`, 'company/warehouses', {companyId:id});
                const warehouses = rows(w, ['warehouses','warehouse','stocks','items','data','result']);
                if (warehouses) console.log(`Warehouses returned: ${warehouses.length}; CENTER match: ${warehouses.some(central)}`);
                else if (w) console.log('Warehouses: unrecognized response fields: ' + safeKeys(w));
              }
              if (companies.length > 15) console.log('Company probe limited to first 15 companies');
            } else if (c) console.log('Companies: unrecognized response fields: ' + safeKeys(c));
            const global = await get('Catalog without pointId', 'v2/nomenclature/list', {withBalance:false, pageSize:25, page:0});
            const items = rows(global, ['nomenclatures']);
            if (items) console.log(`Global catalog first page: ${items.length}; folders: ${items.filter(x => x.isParent).length}; more: ${global?.outcome?.hasMore === true}`);
            else if (global) console.log('Catalog: unrecognized response fields: ' + safeKeys(global));
            console.log('Diagnostics finished');
          }
          main().catch(() => {
            console.error('Diagnostics failed');
            process.exitCode = 1;
          });
          JS
